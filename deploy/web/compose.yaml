# The web app and its PostgreSQL database (/opt/chess/web on the pi). Redis and the ActiveMQ broker run
# from ../redis and ../activemq (/opt/redis and /opt/activemq), reached by name on the shared `chess`
# network, created once with `podman network create chess`; start those first. The engine runs from
# ../engine. Copy .env.example to .env and fill it in, then `podman-compose up -d`.
services:
  web:
    image: ${REGISTRY:-localhost:5000}/3d-webgl-chess:${VERSION:-0.0.1-SNAPSHOT}
    restart: always
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chess
      DB_USERNAME: chess
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      # override the Google client in the image's application-Auth.properties
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    networks: [default, chess]
    depends_on: [postgres]

  postgres:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned directory under here
      - postgres-data:/var/lib/postgresql
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  default:
  chess:
    external: true
