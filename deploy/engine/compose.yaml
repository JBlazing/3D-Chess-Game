# The chess engine. It only needs the ActiveMQ broker from ../web/compose.yaml, so it can run on that
# host or another one; run more copies for more capacity. Copy this directory to the host, copy
# .env.example to .env and fill it in, then `docker compose up -d`.
services:
  engine:
    image: ${REGISTRY:-localhost:5000}/chess-engine:${VERSION:-0.0.1-SNAPSHOT}
    restart: always
    environment:
      ACTIVEMQ_URL: ${ACTIVEMQ_URL:?set ACTIVEMQ_URL in .env}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?set ACTIVEMQ_PASSWORD in .env}
