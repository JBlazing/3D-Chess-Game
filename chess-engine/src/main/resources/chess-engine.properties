# The chess engine service. ActiveMQ: the defaults match a local development broker; elsewhere set
#   ACTIVEMQ_URL=tcp://host:61616  ACTIVEMQ_USER=...  ACTIVEMQ_PASSWORD=...
spring.activemq.broker-url=${ACTIVEMQ_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:}

# Moves played at once by this instance; run more instances to share the queue between them
chess.engine.concurrency=1-4
