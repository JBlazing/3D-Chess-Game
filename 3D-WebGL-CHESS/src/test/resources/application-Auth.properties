# The tests' Google sign-in client: the tests set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (DatabaseTest).
# It's here because src/main/resources/application-Auth.properties holds the real client and isn't in git,
# so the CI pipeline doesn't have it; and on the classpath this one comes first, so the tests never use the real one.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
