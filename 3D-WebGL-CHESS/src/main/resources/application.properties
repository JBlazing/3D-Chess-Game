spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
server.compression.enabled=true

# Google login is on unless another profile is activated (e.g. --spring.profiles.active=noauth)
spring.profiles.default=Auth
# Login is OAuth2 only; don't generate an in-memory user/password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Database: SQLite file by default. To use PostgreSQL set
#   DB_URL=jdbc:postgresql://host:5432/chess  DB_USERNAME=...  DB_PASSWORD=...
# The driver and Hibernate dialect are detected from the URL; Liquibase creates the schema.
# WAL + busy_timeout let SQLite handle concurrent requests without "database is locked" errors.
# transaction_mode=IMMEDIATE takes the write lock when a transaction begins: otherwise two transactions
# that read and then write deadlock on upgrading their locks, and SQLite fails one at once (busy_timeout
# can't help). foreign_keys turns on foreign key enforcement, which SQLite leaves off by default.
spring.datasource.url=${DB_URL:jdbc:sqlite:chess.db?journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE&foreign_keys=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# the schema belongs to Liquibase. Not "validate": SQLite reports column types loosely
# (a 64-bit id shows up as INTEGER), which Hibernate's validator rejects
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Sessions (and with them sign-ins) are stored in the database by Spring Session, so they survive
# server restarts; the cookie outlives the browser window. A session ends after 30 days without a
# visit, or straight away on Sign out. The tables come from Liquibase (004-spring-session.yaml).
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# set to true when the site is served over HTTPS
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

game.chess.js.location=/static/js/Chess.js
game.chess.move.js.location=/Move.js
game.state.cache.duration=PT10M

# Games are blitz, online and against the computer: each side starts with game.clock.initial and gains game.clock.increment
# after every move (5+3). The clock is kept by the server and pushed to the players every second.
game.clock.initial=PT5M
game.clock.increment=PT3S
# scheduled work: matchmaking, the clock pushes and the flag checks that end games on time
spring.task.scheduling.pool.size=4
