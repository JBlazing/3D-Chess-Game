spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
server.compression.enabled=true

# Google login is on unless another profile is activated (e.g. --spring.profiles.active=noauth)
spring.profiles.default=Auth
# Login is OAuth2 only; don't generate an in-memory user/password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Database: SQLite file by default. To use PostgreSQL set
#   DB_URL=jdbc:postgresql://host:5432/chess  DB_USERNAME=...  DB_PASSWORD=...
# The driver and Hibernate dialect are detected from the URL; Liquibase creates the schema.
# WAL + busy_timeout let SQLite handle concurrent requests without "database is locked" errors.
# transaction_mode=IMMEDIATE takes the write lock when a transaction begins: otherwise two transactions
# that read and then write deadlock on upgrading their locks, and SQLite fails one at once (busy_timeout
# can't help). foreign_keys turns on foreign key enforcement, which SQLite leaves off by default.
spring.datasource.url=${DB_URL:jdbc:sqlite:chess.db?journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE&foreign_keys=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# the schema belongs to Liquibase. Not "validate": SQLite reports column types loosely
# (a 64-bit id shows up as INTEGER), which Hibernate's validator rejects
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

game.chess.js.location=/static/js/Chess.js
game.chess.move.js.location=/Move.js
game.state.cache.duration=PT10M
