# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET come from the environment or /etc/jblazing/chess.properties.
# The Google OAuth client must list {baseUrl}/login/oauth2/code/google as an authorized redirect URI,
# e.g. http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_CLIENT_SCOPE}
