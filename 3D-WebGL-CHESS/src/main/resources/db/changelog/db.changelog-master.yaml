# Schema migrations for the PostgreSQL database. Never edit an applied changeset; add a new one.
#
# Each change lives in its own file under changes/, applied in the order included below.
# To add one, create the next numbered file and include it at the end.
databaseChangeLog:
  # Column types, used by the included files
  - property:
      name: id.type
      value: BIGINT
  - property:
      name: timestamp.type
      value: TIMESTAMP WITH TIME ZONE
  # binary data: Liquibase maps BLOB to OID on PostgreSQL, which holds a large-object reference
  # rather than the bytes; BYTEA stores them inline
  - property:
      name: bytes.type
      value: BYTEA

  - include:
      file: changes/001-create-user-account.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/002-create-game.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/003-elo-ratings.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/004-spring-session.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/005-game-clock.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/006-username.yaml
      relativeToChangelogFile: true
