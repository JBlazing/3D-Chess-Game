# Schema migrations, written in Liquibase's database-neutral format so the same
# changesets run on SQLite and PostgreSQL. Never edit an applied changeset; add a new one.
#
# Each change lives in its own file under changes/, applied in the order included below.
# To add one, create the next numbered file and include it at the end.
databaseChangeLog:
  # Column types that differ by database; the included files use them, and the first matching
  # definition wins.
  # SQLite only allows AUTOINCREMENT on a column declared exactly "INTEGER PRIMARY KEY"
  # (SQLite's INTEGER is 64-bit); everywhere else ids are BIGINT.
  - property:
      name: id.type
      value: INTEGER
      dbms: sqlite
  - property:
      name: id.type
      value: BIGINT
  # SQLite has no timestamp type: Liquibase would make these TEXT, but the SQLite driver writes
  # timestamps as epoch milliseconds and can't read those back from a TEXT column. Store them as
  # INTEGER epoch millis (UTC) there; real timestamps everywhere else.
  - property:
      name: timestamp.type
      value: INTEGER
      dbms: sqlite
  - property:
      name: timestamp.type
      value: TIMESTAMP WITH TIME ZONE

  - include:
      file: changes/001-create-user-account.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/002-create-game.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/003-elo-ratings.yaml
      relativeToChangelogFile: true
