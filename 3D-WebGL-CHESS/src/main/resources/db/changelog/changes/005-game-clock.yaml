# Blitz clocks for games. All four columns are null for untimed games (games against the computer,
# and games played before clocks existed).
databaseChangeLog:
  - changeSet:
      id: 5-game-clock
      author: jblazing
      changes:
        - addColumn:
            tableName: game
            columns:
              # the time control: each side's starting time, and the time added after each move
              - column:
                  name: clock_initial_ms
                  type: BIGINT
              - column:
                  name: clock_increment_ms
                  type: BIGINT
              # each side's time left when the side to move began its turn (at updated_at)
              - column:
                  name: white_clock_ms
                  type: BIGINT
              - column:
                  name: black_clock_ms
                  type: BIGINT
