<!DOCTYPE html>
<html lang='en'>
<head>
<title>Game History - 3D Chess</title>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<script type='text/javascript' src='/static/js/session.js'></script>
<link rel='stylesheet' href='/static/css/history.css'>
</head>
<body>

<header class='topbar'>
    <a class='brand' href='/index' aria-label='3D Chess, back to the game'>
        <span class='brand-mark' aria-hidden='true'>&#9822;</span>
        <span class='brand-text'>3D Chess</span>
    </a>
    <div class='topbar-right'>
        <a class='btn btn-primary' href='/index'>New game</a>
        <div id='session' class='session' hidden>
            <a class='session-link' href='/account' aria-label='Your account'>
                <img id='sessionPicture' alt='' referrerpolicy='no-referrer'>
                <span id='sessionName' class='session-name'></span>
            </a>
            <span id='sessionRating' class='session-rating' title='Your rating' hidden></span>
            <button type='button' class='btn btn-pill' onclick='signOut()'>Sign out</button>
        </div>
    </div>
</header>

<main class='page'>
    <div class='title-row'>
        <h1>Game history</h1>
        <span class='rating-pill' id='ratingPill' title='Your rating' hidden></span>
    </div>
    <p class='sub'>Your games, most recent first.</p>

    <section class='stats' id='stats' aria-label='Totals' hidden>
        <div class='stat'><div class='stat-value' id='statPlayed'>0</div><div class='stat-label'>Played</div></div>
        <div class='stat win'><div class='stat-value' id='statWins'>0</div><div class='stat-label'>Wins</div></div>
        <div class='stat loss'><div class='stat-value' id='statLosses'>0</div><div class='stat-label'>Losses</div></div>
        <div class='stat draw'><div class='stat-value' id='statDraws'>0</div><div class='stat-label'>Draws</div></div>
    </section>

    <div class='filters' id='filters' role='group' aria-label='Filter games' hidden></div>

    <div id='loading' class='games' aria-busy='true' aria-label='Loading games'>
        <div class='skeleton'></div><div class='skeleton'></div><div class='skeleton'></div>
    </div>

    <div id='games' class='games'></div>

    <div id='empty' class='state' hidden>
        <div class='state-mark' aria-hidden='true'>&#9816;</div>
        <h2 id='emptyTitle'>No games yet</h2>
        <p id='emptyText'>Games you play are saved here automatically.</p>
        <a class='btn btn-primary' href='/index' id='emptyAction'>Play your first game</a>
    </div>

    <div id='error' class='state' role='alert' hidden>
        <div class='state-mark' aria-hidden='true'>&#9888;&#xFE0E;</div>
        <h2>Couldn't load your games</h2>
        <p>Check your connection and try again.</p>
        <button type='button' class='btn' onclick='loadGames()'>Try again</button>
    </div>

    <p class='note' id='limitNote' hidden>Showing your 50 most recent games.</p>
</main>

<script type='text/javascript' src='/static/js/history.js'></script>
</body>
</html>
